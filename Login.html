<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Directorate | Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a472a;
            --primary-dark: #0d2e1a;
            --primary-light: #2d5e3f;
            --secondary-color: #4caf50;
            --accent-color: #81c784;
            --light-color: #f1f8e9;
            --dark-color: #0a1f13;
            --gray-color: #8da399;
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231a472a" fill-opacity="0.08" d="M0,96L48,112C96,128,192,160,288,186.7C384,213,480,235,576,213.3C672,192,768,128,864,128C960,128,1056,192,1152,192C1248,192,1344,128,1392,96L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .logo-container {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .logo-container img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: var(--box-shadow);
            background: var(--primary-color);
            padding: 8px;
        }

        .logo-container h2 {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.6rem;
        }

        .form-popup {
            width: 950px;
            height: 580px;
            background: #fff;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
            display: flex;
            transition: var(--transition);
        }

        .form-box {
            display: flex;
            width: 100%;
        }

        .form-details {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login .form-details {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        }

        .signup .form-details {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
        }

        .form-details::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            top: -60px;
            right: -60px;
        }

        .form-details::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            bottom: -40px;
            left: -40px;
        }

        .form-details h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .form-details p {
            font-size: 1.1rem;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .form-content {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-content h2 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 35px;
            text-align: center;
            position: relative;
        }

        .form-content h2::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: var(--secondary-color);
            border-radius: 2px;
        }

        .input-field {
            position: relative;
            margin-bottom: 30px;
        }

        .input-field input {
            width: 100%;
            padding: 18px 18px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1.05rem;
            transition: var(--transition);
            background: #f9f9f9;
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 71, 42, 0.2);
            background: #fff;
        }

        .input-field label {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: var(--gray-color);
            pointer-events: none;
            transition: var(--transition);
            background: #fff;
            padding: 0 8px;
        }

        .input-field input:focus + label,
        .input-field input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 0.85rem;
            color: var(--primary-color);
        }

        .forgot-pass-link {
            display: block;
            text-align: right;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 25px;
            transition: var(--transition);
        }

        .forgot-pass-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .policy-text {
            display: flex;
            align-items: center;
            margin: 25px 0;
            font-size: 0.95rem;
        }

        .policy-text input {
            margin-right: 10px;
            accent-color: var(--primary-color);
            transform: scale(1.2);
        }

        .policy-text a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
        }

        .policy-text a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: var(--border-radius);
            background: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.15);
        }

        .btn:disabled {
            background: var(--gray-color);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .bottom-link {
            text-align: center;
            margin-top: 30px;
            font-size: 0.95rem;
            color: var(--gray-color);
        }

        .bottom-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .bottom-link a:hover {
            text-decoration: underline;
        }

        .form-popup .signup,
        .form-popup.show-signup .login {
            display: none;
        }

        .form-popup.show-signup .signup {
            display: flex;
        }

        /* Message styles */
        .message {
            padding: 12px 15px;
            border-radius: var(--border-radius);
            margin: 15px 0;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .error-message {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Decorative elements */
        .leaf-decoration {
            position: absolute;
            width: 140px;
            height: 140px;
            opacity: 0.1;
            z-index: -1;
        }

        .leaf-1 {
            top: 10%;
            right: 10%;
            transform: rotate(45deg);
        }

        .leaf-2 {
            bottom: 10%;
            left: 10%;
            transform: rotate(-30deg);
        }

        @media (max-width: 1000px) {
            .form-popup {
                width: 90%;
                max-width: 850px;
                height: auto;
                flex-direction: column;
            }

            .form-details {
                padding: 40px 30px;
            }

            .form-content {
                padding: 40px 30px;
            }

            .leaf-decoration {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .logo-container {
                top: 20px;
                left: 20px;
            }

            .logo-container h2 {
                font-size: 1.3rem;
            }

            .form-details h2 {
                font-size: 1.8rem;
            }

            .form-content h2 {
                font-size: 1.8rem;
            }
            
            .form-popup {
                width: 95%;
            }
        }
    </style>
</head>
<body>

    </div>

    <div class="logo-container">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cGF0aCBmaWxsPSIjZmZmIiBkPSJNMjU2IDBDMTE0LjYgMCAwIDExNC42IDAgMjU2czExNC42IDI1NiAyNTYgMjU2czI1Ni0xMTQuNiAyNTYtMjU2UzM5Ny40IDAgMjU2IDB6bTAgNDQ4Yy0xMDUuOSAwLTE5Mi04Ni4xLTE5Mi0xOTJzODYuMS0xOTIgMTkyLTE5MlM0NDggMTUwLjEgNDQ4IDI1NnMtODYuMSAxOTItMTkyIDE5MnoiLz48cGF0aCBmaWxsPSIjMWE0NzJhIiBkPSJNMzUyIDI1NmMwIDUzLTQzIDk2LTk2IDk2cy05Ni00My05Ni05NnM0My05NiA5Ni05NnM5NiA0MyA5NiA5NnoiLz48L3N2Zz4=" alt="Land Directorate Logo">
        <h2>Land Directorate</h2>
    </div>

    <div class="form-popup show-popup">
        <!-- Login Form -->
        <div class="form-box login">
            <div class="form-details">
                <h2>Welcome Back</h2>
                <p>Please log in using your personal information to stay connected with us.</p>
            </div>
            <div class="form-content">
                <h2>LOGIN</h2>
                
                <!-- Login Messages -->
                <div id="loginError" class="message error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>
                <div id="loginSuccess" class="message success-message">
                    <i class="fas fa-check-circle"></i>
                    <span></span>
                </div>
                
                <form id="loginForm">
                    <div class="input-field">
                        <input type="text" id="username" placeholder=" " required>
                        <label for="username">Username</label>
                    </div>
                    <div class="input-field">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">Password</label>
                    </div>
                    <a href="#" class="forgot-pass-link">Forgot password?</a>
                    <button type="submit" class="btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                <div class="bottom-link">
                    Don't have an account?
                    <a href="#" id="signup-link">Signup</a>
                </div>
            </div>
        </div>

        <!-- Signup Form -->
        <div class="form-box signup">
            <div class="form-details">
                <h2>Create Account</h2>
                <p>To become a part of our community, please sign up using your personal information.</p>
            </div>
            <div class="form-content">
                <h2>SIGNUP</h2>
                
                <!-- Registration Messages -->
                <div id="registerError" class="message error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>
                <div id="registerSuccess" class="message success-message">
                    <i class="fas fa-check-circle"></i>
                    <span></span>
                </div>
                
                <form id="registerForm">
                    <div class="input-field">
                        <input type="text" id="regUsername" placeholder=" " required>
                        <label for="regUsername">Username</label>
                    </div>
                    <div class="input-field">
                        <input type="email" id="regEmail" placeholder=" " required>
                        <label for="regEmail">Email</label>
                    </div>
                    <div class="input-field">
                        <input type="password" id="regPassword" placeholder=" " required>
                        <label for="regPassword">Password</label>
                    </div>
                    <div class="policy-text">
                        <input type="checkbox" id="policy" required>
                        <label for="policy">
                            I agree to the
                            <a href="#" class="option">Terms & Conditions</a>
                        </label>
                    </div>
                    <button type="submit" class="btn" id="signupBtn">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </form>
                <div class="bottom-link">
                    Already have an account? 
                    <a href="#" id="login-link">Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const formPopup = document.querySelector(".form-popup");
        const signupLoginLink = formPopup.querySelectorAll(".bottom-link a");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const loginBtn = document.getElementById("loginBtn");
        const signupBtn = document.getElementById("signupBtn");

        // API Endpoints
        const API_BASE_URL = "https://lims.ngrok.pro";
        const LOGIN_ENDPOINT = `${API_BASE_URL}/login/`;
        const REGISTER_ENDPOINT = `${API_BASE_URL}/register/`;

        // Show login popup by default when page loads
        window.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("show-popup");
            checkExistingAuth();
        });

        // Check if user is already logged in
        function checkExistingAuth() {
            const token = localStorage.getItem("authToken");
            const userInfo = localStorage.getItem("userInfo");
            
            if (token && userInfo) {
                showLoginSuccess("You are already logged in. Redirecting...");
                setTimeout(() => {
                    window.location.href = "/main.html";
                }, 1500);
            }
        }

        // Toggle between login and signup forms
        signupLoginLink.forEach(link => {
            link.addEventListener("click", (e) => {
                e.preventDefault();
                formPopup.classList[link.id === 'signup-link' ? 'add' : 'remove']("show-signup");
                hideAllMessages();
            });
        });

        // Login form submission
        loginForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Basic validation
            if (!username || !password) {
                showLoginError("Please fill in all fields");
                return;
            }

            loginBtn.innerHTML = '<span class="loading"></span>Signing in...';
            loginBtn.disabled = true;
            hideLoginMessages();

            try {
                const response = await fetch(LOGIN_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();
                console.log("Login response:", data);

                if (response.ok) {
                    // Save token and user info
                    if (data.token) {
                        localStorage.setItem("authToken", data.token);
                    }
                    
                    if (data.id) {
                        localStorage.setItem("userId", JSON.stringify(data.id));
                    }

                    showLoginSuccess("Login successful! Redirecting...");
                    
                    setTimeout(() => {
                        window.location.href = "/main.html";
                    }, 2000);
                } else {
                    let errorMsg = "Login failed. Please check your credentials.";
                    
                    if (data.message) {
                        errorMsg = data.message;
                    } else if (data.error) {
                        errorMsg = data.error;
                    } else if (data.detail) {
                        errorMsg = data.detail;
                    }
                    
                    showLoginError(errorMsg);
                }
            } catch (error) {
                console.error("Login error:", error);
                showLoginError("Network error. Please check your connection and try again.");
            } finally {
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                loginBtn.disabled = false;
            }
        });

        // Registration form submission
        registerForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const username = document.getElementById("regUsername").value;
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;
            const policyAccepted = document.getElementById("policy").checked;

            // Validation
            const errors = validateRegistrationForm(username, email, password, policyAccepted);
            if (errors.length > 0) {
                showRegisterError(errors.join(", "));
                return;
            }

            signupBtn.innerHTML = '<span class="loading"></span>Creating account...';
            signupBtn.disabled = true;
            hideRegisterMessages();

            try {
                const registrationData = {
                    username: username,
                    email: email,
                    password: password
                    // Add other required fields based on your API
                };

                const response = await fetch(REGISTER_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                    },
                    body: JSON.stringify(registrationData),
                });

                const result = await response.json();

                if (response.ok) {
                    showRegisterSuccess("Account created successfully! You can now login.");
                    registerForm.reset();
                    
                    // Auto switch to login form after successful registration
                    setTimeout(() => {
                        formPopup.classList.remove("show-signup");
                    }, 2000);
                } else {
                    showRegisterError(
                        result.message || result.error || "Failed to create account. Please try again."
                    );
                }
            } catch (error) {
                console.error("Registration error:", error);
                showRegisterError("Network error. Please try again.");
            } finally {
                signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
                signupBtn.disabled = false;
            }
        });

        // Form validation functions
        function validateRegistrationForm(username, email, password,policyAccepted) {
            const errors = [];

            if (!username || !email || !password ) {
                errors.push("All fields are required");
            }

        
            if (password.length < 6) {
                errors.push("Password must be at least 6 characters long");
            }

            if (!policyAccepted) {
                errors.push("You must accept the Terms & Conditions");
            }

            if (email && !isValidEmail(email)) {
                errors.push("Please enter a valid email address");
            }

            return errors;
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Message display functions
        function showLoginError(message) {
            const errorDiv = document.getElementById("loginError");
            const successDiv = document.getElementById("loginSuccess");

            errorDiv.querySelector("span").textContent = message;
            errorDiv.style.display = "flex";
            successDiv.style.display = "none";
        }

        function showLoginSuccess(message) {
            const errorDiv = document.getElementById("loginError");
            const successDiv = document.getElementById("loginSuccess");

            successDiv.querySelector("span").textContent = message;
            successDiv.style.display = "flex";
            errorDiv.style.display = "none";
        }

        function showRegisterError(message) {
            const errorDiv = document.getElementById("registerError");
            const successDiv = document.getElementById("registerSuccess");

            errorDiv.querySelector("span").textContent = message;
            errorDiv.style.display = "flex";
            successDiv.style.display = "none";
        }

        function showRegisterSuccess(message) {
            const errorDiv = document.getElementById("registerError");
            const successDiv = document.getElementById("registerSuccess");

            successDiv.querySelector("span").textContent = message;
            successDiv.style.display = "flex";
            errorDiv.style.display = "none";
        }

        function hideLoginMessages() {
            document.getElementById("loginError").style.display = "none";
            document.getElementById("loginSuccess").style.display = "none";
        }

        function hideRegisterMessages() {
            document.getElementById("registerError").style.display = "none";
            document.getElementById("registerSuccess").style.display = "none";
        }

        function hideAllMessages() {
            hideLoginMessages();
            hideRegisterMessages();
        }
    </script>
</body>
</html>
